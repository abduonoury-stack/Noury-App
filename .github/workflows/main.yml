
name: Build Noury App APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Noury_App.zip'
      - '.github/workflows/build-noury-app.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          test -f Noury_App.zip || {
            echo "Noury_App.zip not found"
            exit 1
          }
          mkdir extracted
          unzip -q Noury_App.zip -d extracted

          SETTINGS=$(find extracted -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \))

          COUNT=$(echo "$SETTINGS" | grep -c . || true)

          if [ "$COUNT" -ne 1 ]; then
            echo "Expected one Android project settings file"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' | head -n 1)

          test -n "$APK" || {
            echo "APK was not generated"
            exit 1
          }

          mkdir -p output
          cp "$APK" output/Noury-App.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Noury-App-APK
          path: output/Noury-App.apk
